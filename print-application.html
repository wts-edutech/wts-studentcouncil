<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>แบบฟอร์มใบสมัครเลือกตั้ง A4 | โรงเรียนวชิรธรรมสาธิต</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css?v=257014">
  <style>
    @page {
      size: A4 portrait;
      margin: 12mm 15mm 12mm 15mm;
    }
    .print-doc {
      font-family: 'Sarabun', sans-serif;
      font-size: 13px;
      line-height: 1.4;
      color: #000;
    }
    .dotted-line {
      border-bottom: 1px dotted #333;
      display: inline-block;
      padding: 0 4px;
    }
  </style>
</head>
<body class="bg-slate-200 min-h-screen py-6 print:py-0 print:bg-white font-formal">

  <!-- แถบควบคุมก่อนพิมพ์ (ซ่อนเมื่อกดพิมพ์) -->
  <div class="no-print max-w-4xl mx-auto mb-4 bg-slate-800 text-white p-3 rounded flex flex-wrap items-center justify-between gap-3 text-xs">
    <div class="flex items-center space-x-3">
      <a href="index.html" class="p-1.5 bg-slate-700 hover:bg-slate-600 rounded text-slate-200 transition">
        <i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก
      </a>
      <div>
        <span class="font-bold">พิมพ์แบบฟอร์มใบสมัครกระดาษ A4 ทางการ</span>
        <span class="text-slate-400 ml-2">ขนาดมาตรฐาน A4 พอดี 1 หน้ากระดาษ</span>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="window.print()" class="gov-btn gov-btn-navy">
        <i class="fa-solid fa-print mr-1.5"></i> พิมพ์ / บันทึก PDF
      </button>
      <button onclick="toggleBlankForm()" id="blankToggleBtn" class="gov-btn gov-btn-gray">
        <i class="fa-solid fa-file mr-1.5"></i> สลับเป็นแบบฟอร์มเปล่า
      </button>
    </div>
  </div>

  <!-- A4 Document Container Wrapper (allows horizontal scroll on small mobile screens while maintaining strict A4 ratio) -->
  <div class="w-full overflow-x-auto px-2 sm:px-0">
    <div id="printArea" class="a4-page print-doc mx-auto bg-white shadow-md">
      <div id="documentContent">
        <div class="text-center py-20 text-slate-400">
          <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
          <p>กำลังจัดเตรียมแบบฟอร์ม A4...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js?v=257014"></script>
  <script src="js/app.js?v=257014"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const appType = urlParams.get('type') || 'council';
    const appId = urlParams.get('id') || '';
    const isBlank = urlParams.get('blank') === '1';

    let currentIsBlank = isBlank;

    function renderApplication() {
      const container = document.getElementById('documentContent');
      const cfg = WDSDB.getConfig();
      
      let data = null;
      if (!currentIsBlank && appId) {
        data = WDSDB.getById(appType, appId);
      }

      if (appType === 'council') {
        renderCouncilDocument(container, data, cfg);
      } else {
        renderColorDocument(container, data, cfg);
      }
    }

    // ฟังก์ชันสร้างช่องผู้ลงนามแบบไดนามิก (Dynamic Signatures Grid)
    function renderSignaturesGrid(signatures, d, type, cfg) {
      if (!signatures || !signatures.length) return '';

      const colCount = signatures.length;
      let gridColsClass = 'grid-cols-3';
      if (colCount === 1) gridColsClass = 'grid-cols-1 max-w-xs mx-auto';
      else if (colCount === 2) gridColsClass = 'grid-cols-2';
      else if (colCount === 3) gridColsClass = 'grid-cols-3';
      else if (colCount === 4) gridColsClass = 'grid-cols-4';
      else gridColsClass = 'grid-cols-3';

      const year = cfg.academicYear ? (parseInt(cfg.academicYear, 10) - 1).toString() : '2569';

      const boxesHtml = signatures.map((sig, idx) => {
        let displayName = '......................................................';
        if (sig.signerType === 'applicant') {
          if (type === 'council') {
            displayName = d?.members?.president?.fullname || '......................................................';
          } else {
            displayName = d?.leader?.fullname || '......................................................';
          }
        } else if (sig.signerType === 'advisor') {
          displayName = d?.advisorName || '......................................................';
        } else if (sig.signerType === 'custom') {
          displayName = sig.signerName ? sig.signerName : '......................................................';
        }

        const dateStr = sig.showDate ? (sig.dateText || `วันที่........เดือน...................พ.ศ. ${year}`) : '';
        const hasHeader = Boolean(sig.headerText);
        const hasStatus = Boolean(sig.hasStatusCheck);
        const isApproved = d?.status === 'approved';

        return `
          <div class="border border-black p-2 flex flex-col justify-between h-28 text-[11px] ${hasHeader ? 'bg-slate-50' : ''}">
            ${hasHeader ? `<div class="font-bold text-[10px] leading-tight">${sig.headerText}</div>` : ''}
            ${hasStatus ? `
              <div class="text-[10px] leading-tight">
                [ ${isApproved ? '✓' : ' '} ] ${sig.statusLabel || 'ผ่านคุณสมบัติ'} &nbsp;&nbsp; [ ] ไม่ผ่าน
              </div>
            ` : ''}
            <div class="leading-tight">${sig.signatureLabel || 'ลงชื่อ......................................................'}</div>
            <div class="leading-tight">( ${displayName} )</div>
            ${sig.positionText ? `<div class="text-[9px] leading-tight">(${sig.positionText})</div>` : ''}
            ${sig.showDate ? `<div class="leading-tight text-[10px]">${dateStr}</div>` : ''}
          </div>
        `;
      }).join('');

      return `
        <!-- Signatures (Dynamic ${colCount} Columns) -->
        <div class="grid ${gridColsClass} gap-2 text-center text-[11px]">
          ${boxesHtml}
        </div>
      `;
    }

    // ฟอร์มสภานักเรียน A4
    function renderCouncilDocument(container, d, cfg) {
      const isFilled = !!d;
      const m = d?.members || {};
      const pres = m.president || {};
      let logo1 = cfg.schoolLogo || DEFAULT_SCHOOL_LOGO;
      if (!logo1 || typeof logo1 !== 'string' || logo1.includes('iVBORw0KGgoAAAANSUhEUgAAACgAAAAyCAYAAAAus5mQ')) {
        logo1 = DEFAULT_SCHOOL_LOGO;
      }
      const logo2 = cfg.schoolLogo2 !== undefined ? cfg.schoolLogo2 : DEFAULT_LOGO_2;
      const logo3 = cfg.schoolLogo3 !== undefined ? cfg.schoolLogo3 : DEFAULT_LOGO_3;
      const logosHtml = [logo1, logo2, logo3].filter(Boolean).map(src => `
        <div class="w-15 h-15 flex items-center justify-center overflow-hidden" style="width: 3.8rem; height: 3.8rem;">
          <img src="${src}" class="w-full h-full object-contain" alt="ตราสัญลักษณ์" onerror="this.onerror=null; this.src='assets/images/school-logo-transparent.png';">
        </div>
      `).join('');

      container.innerHTML = `
        <!-- Official Header -->
        <div class="text-center relative border-b-2 border-black pb-3 mb-3">
          <div class="flex justify-center items-center space-x-2 mb-1">
            ${logosHtml}
          </div>
          <h2 class="text-lg font-bold">${cfg.schoolName}</h2>
          <p class="text-xs">${cfg.departmentName}</p>
          <h3 class="text-base font-bold mt-1">ใบสมัครรับเลือกตั้งประธานสภานักเรียน ประจำปีการศึกษา ${cfg.academicYear}</h3>
          
          <div class="absolute right-0 top-0 text-right">
            <div class="border border-black p-1 text-center min-w-[90px] text-xs">
              <div>หมายเลขพรรค</div>
              <div class="text-xl font-bold font-mono">${d?.candidateNumber ? 'เบอร์ ' + d.candidateNumber : '_______'}</div>
            </div>
            <div class="text-[10px] text-slate-500 mt-1">รหัส: ${d?.id || 'COUNCIL-' + cfg.academicYear + '-XXX'}</div>
          </div>
        </div>

        <!-- Party Information -->
        <div class="mb-3 text-xs">
          <div class="grid grid-cols-12 gap-2 mb-1">
            <div class="col-span-8">
              <strong>ชื่อพรรค:</strong> 
              <span class="dotted-line min-w-[250px] font-bold text-sm">${d?.partyName || '...................................................................................................'}</span>
            </div>
            <div class="col-span-4 text-right">
              <strong>วันที่สมัคร:</strong> 
              <span class="dotted-line min-w-[120px]">${d?.submittedAt || '......../......../........'}</span>
            </div>
          </div>
          <div>
            <strong>สโลแกน / คำขวัญพรรค:</strong> 
            <span class="dotted-line w-10/12 italic">${d?.slogan || '..........................................................................................................................................................'}</span>
          </div>
          <div class="mt-1">
            <strong>ครูที่ปรึกษาพรรค:</strong> 
            <span class="dotted-line min-w-[200px]">${d?.advisorName || '..............................................................'}</span>
            <span class="ml-4"><strong>เบอร์โทรศัพท์:</strong> <span class="dotted-line min-w-[140px]">${d?.advisorPhone || '............................................'}</span></span>
          </div>
        </div>

        <!-- Leader Photo & Info Highlights -->
        <div class="flex gap-4 p-2 bg-slate-50 border border-black mb-3">
          <div class="photo-box border border-black flex-shrink-0 bg-white" style="width: 2.8cm; height: 3.5cm;">
            ${pres.photo ? `<img src="${pres.photo}" class="w-full h-full object-cover">` : '<div class="text-[10px] p-2 text-center text-slate-500">ติดรูปถ่าย 1.5 นิ้ว<br>(สวมชุดนักเรียน)</div>'}
          </div>
          <div class="flex-grow text-xs space-y-1">
            <div class="font-bold text-sm text-[#16325c] border-b border-slate-300 pb-1">
              ข้อมูลผู้ลงสมัครประธานสภานักเรียน (หัวหน้าพรรค)
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
              <div><strong>ชื่อ-นามสกุล:</strong> <span class="dotted-line font-bold">${pres.fullname || '............................................................'}</span></div>
              <div><strong>ระดับชั้น:</strong> ม.4 ห้อง <span class="dotted-line font-bold">${pres.room || '.......'}</span></div>
              <div><strong>เลขประจำตัวนักเรียน:</strong> <span class="dotted-line font-mono font-bold">${pres.studentId || '....................'}</span></div>
              <div><strong>เบอร์โทรศัพท์:</strong> <span class="dotted-line">${pres.phone || '..............................'}</span></div>
              <div><strong>คะแนนพฤติกรรมคงเหลือ:</strong> <span class="dotted-line font-bold text-green-800">${pres.behaviorScore !== undefined ? pres.behaviorScore + ' คะแนน' : '............ คะแนน'}</span> (ขั้นต่ำ ${cfg.minBehaviorScore})</div>
              <div><strong>เกรดเฉลี่ย ม.4 ภาคเรียนที่ 1:</strong> <span class="dotted-line font-bold text-green-800">${pres.gpax || '..........'}</span> (ขั้นต่ำ ${cfg.minGpaPresident})</div>
            </div>
            <div class="text-[11px] text-slate-700 pt-1">
              [ ✓ ] ยอมรับข้อตกลงของสภานักเรียน ${cfg.schoolName} ประจำปีการศึกษา ${cfg.councilAgreementYear}
            </div>
          </div>
        </div>

        <!-- 10 Positions Table -->
        <div class="mb-3">
          <div class="text-xs font-bold mb-1">รายชื่อผู้แทนพรรคเพื่อดำรงตำแหน่งคณะกรรมการสภานักเรียน (ครบทั้ง 10 ตำแหน่ง):</div>
          <table class="formal-table text-[11px]">
            <thead>
              <tr class="bg-slate-100">
                <th style="width: 5%;">ที่</th>
                <th style="width: 25%;">ตำแหน่งในสภานักเรียน</th>
                <th style="width: 25%;">ชื่อ - นามสกุล</th>
                <th style="width: 8%;">ห้อง</th>
                <th style="width: 11%;">เลขประจำตัว</th>
                <th style="width: 9%;">คะแนนคงเหลือ</th>
                <th style="width: 8%;">เกรดเฉลี่ย</th>
                <th style="width: 9%;">ข้อตกลง</th>
              </tr>
            </thead>
            <tbody>
              ${renderPositionRow(1, 'ผู้ลงสมัครประธานสภานักเรียน', m.president)}
              ${renderPositionRow(2, 'รองประธานพรรค', m.vice_president)}
              ${renderPositionRow(3, 'ฝ่ายวิชาการ (คนที่ 1)', m.academic_1)}
              ${renderPositionRow(4, 'ฝ่ายวิชาการ (คนที่ 2)', m.academic_2)}
              ${renderPositionRow(5, 'ฝ่ายสันทนาการ (คนที่ 1)', m.recreation_1)}
              ${renderPositionRow(6, 'ฝ่ายสันทนาการ (คนที่ 2)', m.recreation_2)}
              ${renderPositionRow(7, 'ฝ่ายทั่วไป', m.general)}
              ${renderPositionRow(8, 'ฝ่ายประชาสัมพันธ์ (คนที่ 1)', m.pr_1)}
              ${renderPositionRow(9, 'ฝ่ายประชาสัมพันธ์ (คนที่ 2)', m.pr_2)}
              ${renderPositionRow(10, 'เลขานุการ', m.secretary)}
            </tbody>
          </table>
        </div>

        <!-- Agreement statement -->
        <div class="border border-black p-2 text-[11px] mb-3 bg-slate-50">
          <strong>คำรับรองและข้อตกลง:</strong> ข้าพเจ้าและสมาชิกพรรคทุกคน ขอรับรองว่ามีคุณสมบัติตรงตามระเบียบการเลือกตั้งประธานสภานักเรียน ประจำปีการศึกษา ${cfg.academicYear} และขอให้คำมั่นสัญญาว่าจะปฏิบัติหน้าที่ด้วยความซื่อสัตย์ สุจริต และ <strong>ยอมรับข้อตกลงของสภานักเรียน ${cfg.schoolName} ประจำปีการศึกษา ${cfg.councilAgreementYear}</strong> ทุกประการ
        </div>

        <!-- Signatures (Dynamic Columns) -->
        ${renderSignaturesGrid(cfg.councilSignatures || [], d, 'council', cfg)}
      `;
    }

    function renderPositionRow(num, title, mem) {
      if (!mem || !mem.fullname) {
        return `
          <tr>
            <td class="text-center">${num}</td>
            <td>${title}</td>
            <td>................................................</td>
            <td class="text-center">ม.4/..</td>
            <td class="text-center">..........</td>
            <td class="text-center">.....</td>
            <td class="text-center">.....</td>
            <td class="text-center">[ ] ยอมรับ</td>
          </tr>
        `;
      }
      return `
        <tr>
          <td class="text-center font-bold">${num}</td>
          <td><strong>${title}</strong></td>
          <td>${mem.fullname}</td>
          <td class="text-center">ม.${mem.grade || '4'}/${mem.room}</td>
          <td class="text-center font-mono">${mem.studentId}</td>
          <td class="text-center font-semibold text-green-800">${mem.behaviorScore}</td>
          <td class="text-center font-semibold">${mem.gpax}</td>
          <td class="text-center font-bold text-green-800">✓ ยอมรับ</td>
        </tr>
      `;
    }

    // ฟอร์มประธานคณะสี A4
    function renderColorDocument(container, d, cfg) {
      const isFilled = !!d;
      const leader = d?.leader || {};
      const members = d?.members || [];
      let logo1 = cfg.schoolLogo || DEFAULT_SCHOOL_LOGO;
      if (!logo1 || typeof logo1 !== 'string' || logo1.includes('iVBORw0KGgoAAAANSUhEUgAAACgAAAAyCAYAAAAus5mQ')) {
        logo1 = DEFAULT_SCHOOL_LOGO;
      }
      const logo2 = cfg.schoolLogo2 !== undefined ? cfg.schoolLogo2 : DEFAULT_LOGO_2;
      const logo3 = cfg.schoolLogo3 !== undefined ? cfg.schoolLogo3 : DEFAULT_LOGO_3;
      const logosHtml = [logo1, logo2, logo3].filter(Boolean).map(src => `
        <div class="w-15 h-15 flex items-center justify-center overflow-hidden" style="width: 3.8rem; height: 3.8rem;">
          <img src="${src}" class="w-full h-full object-contain" alt="ตราสัญลักษณ์" onerror="this.onerror=null; this.src='assets/images/school-logo-transparent.png';">
        </div>
      `).join('');

      container.innerHTML = `
        <!-- Official Header -->
        <div class="text-center relative border-b-2 border-black pb-3 mb-3">
          <div class="flex justify-center items-center space-x-2 mb-1">
            ${logosHtml}
          </div>
          <h2 class="text-lg font-bold">${cfg.schoolName}</h2>
          <p class="text-xs">${cfg.departmentName}</p>
          <h3 class="text-base font-bold mt-1">ใบสมัครรับเลือกตั้งประธานคณะสี ประจำปีการศึกษา ${cfg.academicYear}</h3>
          <p class="text-xs font-semibold text-slate-700">
            [ 1. คณะสีอัญชัน &nbsp; 2. คณะสีนนทรี &nbsp; 3. คณะปาริชาต &nbsp; 4. คณะสีเอื้องช่อแสด &nbsp; 5. คณะสีอินทนิล ]
          </p>

          <div class="absolute right-0 top-0 text-right">
            <div class="border border-black p-1 text-center min-w-[90px] text-xs">
              <div>หมายเลขผู้สมัคร</div>
              <div class="text-xl font-bold font-mono">${d?.candidateNumber ? 'เบอร์ ' + d.candidateNumber : '_______'}</div>
            </div>
            <div class="text-[10px] text-slate-500 mt-1">รหัส: ${d?.id || 'COLOR-' + cfg.academicYear + '-XXX'}</div>
          </div>
        </div>

        <!-- Color House & Party Name -->
        <div class="mb-3 text-xs">
          <div class="grid grid-cols-12 gap-2 mb-1">
            <div class="col-span-6">
              <strong>สังกัดคณะสี:</strong> 
              <span class="dotted-line min-w-[160px] font-bold text-sm text-[#16325c]">${d?.colorName || '...................................................'}</span>
            </div>
            <div class="col-span-6 text-right">
              <strong>วันที่สมัคร:</strong> 
              <span class="dotted-line min-w-[120px]">${d?.submittedAt || '......../......../........'}</span>
            </div>
          </div>
          <div class="grid grid-cols-12 gap-2 mb-1">
            <div class="col-span-7">
              <strong>ชื่อพรรค:</strong> 
              <span class="dotted-line min-w-[200px] font-bold">${d?.partyName || '....................................................................................'}</span>
            </div>
            <div class="col-span-5">
              <strong>ครูที่ปรึกษาพรรค:</strong> 
              <span class="dotted-line min-w-[140px]">${d?.advisorName || '............................................'}</span>
            </div>
          </div>
          <div class="grid grid-cols-12 gap-2">
            <div class="col-span-12">
              <strong>สโลแกน/คำขวัญประจำพรรค:</strong> 
              <span class="dotted-line min-w-[320px]">${d?.slogan || '..........................................................................................................................'}</span>
            </div>
          </div>
        </div>

        <!-- Leader Photo & Details -->
        <div class="flex gap-4 p-2.5 bg-slate-50 border border-black mb-3">
          <div class="photo-box border border-black flex-shrink-0 bg-white" style="width: 2.8cm; height: 3.5cm;">
            ${leader.photo ? `<img src="${leader.photo}" class="w-full h-full object-cover">` : '<div class="text-[10px] p-2 text-center text-slate-500">ติดรูปถ่าย 1.5 นิ้ว<br>(สวมชุดนักเรียน)</div>'}
          </div>
          <div class="flex-grow text-xs space-y-1">
            <div class="font-bold text-sm text-slate-900 border-b border-slate-300 pb-1">
              ข้อมูลผู้ลงสมัครประธานคณะสี
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1">
              <div><strong>ชื่อ-นามสกุล:</strong> <span class="dotted-line font-bold">${leader.fullname || '............................................................'}</span></div>
              <div><strong>ระดับชั้น:</strong> ม.4 ห้อง <span class="dotted-line font-bold">${leader.room || '.......'}</span></div>
              <div><strong>เลขประจำตัวนักเรียน:</strong> <span class="dotted-line font-mono font-bold">${leader.studentId || '....................'}</span></div>
              <div><strong>เบอร์โทรศัพท์ติดต่อ:</strong> <span class="dotted-line">${leader.phone || '..............................'}</span></div>
              <div><strong>คะแนนพฤติกรรมคงเหลือ:</strong> <span class="dotted-line font-bold text-green-800">${leader.behaviorScore !== undefined ? leader.behaviorScore + ' คะแนน' : '............ คะแนน'}</span> (ขั้นต่ำ ${cfg.minBehaviorScore})</div>
              <div><strong>เกรดเฉลี่ยสะสม (ม.4 เทอม 1):</strong> <span class="dotted-line font-bold text-green-800">${leader.gpax || '..........'}</span> (ขั้นต่ำ ${cfg.minGpaMember})</div>
            </div>
            <div class="text-[11px] text-slate-700 pt-1">
              [ ✓ ] ยอมรับข้อตกลงของสภานักเรียน ${cfg.schoolName} ประจำปีการศึกษา ${cfg.colorAgreementYear}
            </div>
          </div>
        </div>

        <!-- Team Members Table -->
        <div class="mb-3">
          <div class="text-xs font-bold mb-1">รายชื่อคณะทำงานและสมาชิกในพรรค/ทีมงานคณะสี:</div>
          <table class="formal-table text-[11px]">
            <thead>
              <tr class="bg-slate-100">
                <th style="width: 6%;">ที่</th>
                <th style="width: 28%;">ชื่อ - นามสกุล</th>
                <th style="width: 20%;">บทบาทหน้าที่ในคณะสี</th>
                <th style="width: 10%;">ห้อง</th>
                <th style="width: 14%;">เลขประจำตัว</th>
                <th style="width: 11%;">คะแนนพฤติกรรม</th>
                <th style="width: 11%;">เกรดเฉลี่ย</th>
              </tr>
            </thead>
            <tbody>
              ${renderColorMembersRows(members)}
            </tbody>
          </table>
        </div>

        <!-- Agreement statement -->
        <div class="border border-black p-2 text-[11px] mb-3 bg-slate-50">
          <strong>คำรับรองและข้อตกลง:</strong> ข้าพเจ้าและคณะทำงานทุกคน ขอรับรองว่ามีคุณสมบัติตรงตามระเบียบการเลือกตั้งประธานคณะสี ประจำปีการศึกษา ${cfg.academicYear} และขอให้คำมั่นสัญญาว่าจะส่งเสริมความสามัคคี พัฒนากิจกรรมคณะสี และ <strong>ยอมรับข้อตกลงของสภานักเรียน ${cfg.schoolName} ประจำปีการศึกษา ${cfg.colorAgreementYear}</strong> ทุกประการ
        </div>

        <!-- Signatures (Dynamic Columns) -->
        ${renderSignaturesGrid(cfg.colorSignatures || [], d, 'color', cfg)}
      `;
    }

    function renderColorMembersRows(members) {
      if (!members || members.length === 0) {
        return COLOR_MEMBER_POSITIONS.map((pos, idx) => `
          <tr>
            <td class="text-center">${idx + 1}</td>
            <td>................................................</td>
            <td><strong>${pos.title}</strong></td>
            <td class="text-center">ม.4/..</td>
            <td class="text-center">..........</td>
            <td class="text-center">.....</td>
            <td class="text-center">.....</td>
          </tr>
        `).join('');
      }

      return members.map((mem, idx) => `
        <tr>
          <td class="text-center font-bold">${idx + 1}</td>
          <td>${mem.fullname}</td>
          <td>${mem.role || 'คณะทำงาน'}</td>
          <td class="text-center">ม.${mem.grade || '4'}/${mem.room}</td>
          <td class="text-center font-mono">${mem.studentId}</td>
          <td class="text-center font-semibold text-green-800">${mem.behaviorScore}</td>
          <td class="text-center font-semibold">${mem.gpax}</td>
        </tr>
      `).join('');
    }

    function toggleBlankForm() {
      currentIsBlank = !currentIsBlank;
      document.getElementById('blankToggleBtn').innerHTML = currentIsBlank 
        ? '<i class="fa-solid fa-file-pen mr-1.5"></i> แสดงข้อมูลที่บันทึก' 
        : '<i class="fa-solid fa-file mr-1.5"></i> สลับเป็นแบบฟอร์มเปล่า';
      renderApplication();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderApplication();
    });
  </script>
</body>
</html>
